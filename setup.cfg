[metadata]
name = osml-imagery-toolkit
version = 1.5.0
description = Toolkit to work with imagery collected by satellites and UAVs
long_description = file: PACKAGE_DESCRIPTION.md
long_description_content_type = text/markdown
author = Amazon Web Services
author_email = aws-osml-admin@amazon.com
license = Apache-2.0
project_urls =
    Source = https://github.com/awslabs/osml-imagery-toolkit
    Tracker = https://github.com/awslabs/osml-imagery-toolkit/issues
classifiers =
    License :: OSI Approved :: Apache Software License
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    Programming Language :: Python :: 3.14
    Operating System :: OS Independent

[options]
zip_safe = False
package_dir=
    =src
packages=find_namespace:
python_requires = >=3.10
include_package_data = True

install_requires =
    numpy>=1.23.0,<2.0;python_version<'3.12'
    numpy>=1.23.0,<2.3.2;python_version>='3.12'
    scipy>=1.10.0
    opencv-python-headless>=4.9.0
    cachetools>=5.3.2
    geojson>=3.1.0
    pyproj>=3.6.1
    shapely>=2.0.2
    xsdata>=24.1
    defusedxml>=0.7.1

[options.packages.find]
where = src
exclude =
    test

[options.package_data]
package_data =
    = ["py.typed"]

[options.extras_require]
gdal =
    gdal>=3.7.0,<3.14
test =
    tox
